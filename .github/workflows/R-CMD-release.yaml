name: R Package Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Create release if version changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(grep -m1 '^Version:' DESCRIPTION | sed 's/^Version:[[:space:]]*//' | tr -d '[:space:]')
          echo "DESCRIPTION version: $VERSION"
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release $VERSION already exists, nothing to do."
          else
            gh release create "$VERSION" --target "$GITHUB_SHA" --title "Release $VERSION" --generate-notes
          fi
